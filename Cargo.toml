[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/kmaxxdev/Maurice-PaaS"

[workspace.dependencies]
maurice-core = { path = "crates/maurice-core" }
maurice-quadlet = { path = "crates/maurice-quadlet" }
maurice-api = { path = "crates/maurice-api" }
maurice-agent = { path = "crates/maurice-agent" }
maurice-db = { path = "crates/maurice-db" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
axum = { version = "0.8", features = ["tokio", "http1", "http2"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
http = "1"
http-body = "1"
connectrpc = { version = "0.9", features = ["axum", "server", "client"] }
connectrpc-build = "0.9"
buffa = "0.9"
buffa-types = { version = "0.9", features = ["json"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde"] }
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
