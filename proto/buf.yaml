version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # The API shape is Workspaces.List / Plans.Apply with shared Plan and Empty
    # responses; see docs/decisions/005-connectrpc-api.md.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
