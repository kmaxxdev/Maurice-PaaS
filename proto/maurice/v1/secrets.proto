syntax = "proto3";

package maurice.v1;

import "google/protobuf/timestamp.proto";

// Values never leave the panel: only names and metadata are listed.
message SecretInfo {
  string id = 1;
  string workspace_id = 2;
  string name = 3;
  uint32 version = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListSecretsRequest {
  string workspace_id = 1;
}
message ListSecretsResponse {
  repeated SecretInfo secrets = 1;
}
message SetSecretRequest {
  string workspace_id = 1;
  string name = 2;
  bytes value = 3;
}

service Secrets {
  // scope: read
  rpc List(ListSecretsRequest) returns (ListSecretsResponse);
  // scope: apply. Stores the value encrypted and pushes it to podman as the workspace user.
  // Overwrites a previous value; the old version is kept in the database.
  rpc Set(SetSecretRequest) returns (SecretInfo);
}
