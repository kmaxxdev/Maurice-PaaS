syntax = "proto3";

package maurice.v1;

import "maurice/v1/common.proto";

message Workspace {
  string id = 1;
  string name = 2;
  string unix_user = 3;
  uint32 uid = 4;
  uint32 subuid_start = 5;
  uint32 subuid_len = 6;
  string home = 7;
  // Environments that exist in this workspace, each with its own network.
  repeated Env environments = 8;
  string cpu_slice = 9;
}

message ListWorkspacesRequest {}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}
message GetWorkspaceRequest {
  string id = 1;
}
message PlanCreateWorkspaceRequest {
  string name = 1;
  // Environments to create with the workspace; empty = dev and prod.
  repeated Env environments = 2;
}
message PlanAddEnvironmentRequest {
  string workspace_id = 1;
  Env environment = 2;
}
message PlanDeleteWorkspaceRequest {
  string id = 1;
  // Also remove the home directory and volumes. Always destructive.
  bool purge = 2;
}

service Workspaces {
  // scope: read
  rpc List(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  // scope: read
  rpc Get(GetWorkspaceRequest) returns (Workspace);
  // scope: plan
  rpc PlanCreate(PlanCreateWorkspaceRequest) returns (Plan);
  // scope: plan. Adds an environment (and its network) to an existing workspace.
  rpc PlanAddEnvironment(PlanAddEnvironmentRequest) returns (Plan);
  // scope: plan; the resulting plan is destructive
  rpc PlanDelete(PlanDeleteWorkspaceRequest) returns (Plan);
}
